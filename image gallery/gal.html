<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Image Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
    


    <link rel="stylesheet" href="gal.css">
</head>
<body>
          <h1>Cat Image Gallery</h1>
    <div class="gallery">
        <img src="images/Sphynx-cat.jpg" alt="Sphynx cat">
        <img src="images/Orange-kitten.avif" alt="Orange cat">
        <img src="images/Siamese-cat.jpg" alt="Siamese cat">
        <img src="images/British-Shorthair-Cat.jpg" alt="British Shorthair cat">
        <img src="images/Tuxedo-cat.jpg" alt="Tuxedo cat">
        <img src="images/Oriental-cat.jpg" alt="Oriental cat">
        <img src="images/Black-Oriental-Shorthair-cat.jpg" alt="Black Oriental Shorthair cat">
        <img src="images/Black-cat.jpg" alt="Black cat">
    </div>

    <div class="lightbox" id="lightbox">
        <span class="close" id="close-btn">&times;</span>
        <img id="lightbox-img"  src="" alt="large Image">
        <button class="nav prev" id="prev-btn">&#10094;</button>
        <button class="nav next" id="next-btn">&#10095;</button>
    </div>

 <script src="gal.js"></script>

</body>
</html>
